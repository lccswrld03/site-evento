<!DOCTYPE html>
<html style="background-color: black;" lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Página de inscrição para a seletiva da Batalha da Junção em Rio Grande, RS.">
        <title>Inscrição para a Seletiva BDJ</title>

        <link 
            rel="stylesheet"
            href="inscricao.css">
    </head>

    <body>
        
        <header>

            <img width="150" height="auto" src="img/batalhajuncaologo2.png" alt="Logo Batalha da Junção">

            <nav>
                <div>
                    <a href="../Site_evento/index.html">Início</a>
                <b>|</b>
                    <a href="../Site_evento/informacoes.html">Informação</a>
                </div>
        </nav>

        <div>
            <small>© 2026 Lucca Menestrino. Todos os direitos reservados.</small>
        </div>
        </header>

        <br><br><br><br> <br><br><br><br>

         <section id="formulario">
            <div>

                <div>
                    <h1>FORMULÁRIO DE INSCRIÇÃO</h1> 
                </div>

                <br><br><br><br>

                <form method="get">

                    <label for="nome">
                    <p><b>1.</b> Nome completo:</p>
                    <div class="nome">
                        <input type="text" id="nome" name="nome" placeholder="Primeiro nome" required><br>
                        <input type="text" id="sobrenome" name="sobrenome" placeholder="Último nome" required>
                    </div>
                    </label>

                    <br><br>

                    <label for="telefone">
                    <p><b>2. </b> Telefone: <b>*</b></p>
                    <input maxlength="11" type="text" id="telefone" name="telefone" placeholder="☏ (DDD)" required>
                    <br>
                    <small><em>sem espaços</em></small>
                    </label>

                    <br><br>

                    <label for="email">
                    <p><b>3. </b> Email:</p>
                    <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
                    </label>

                    <br><br><br><br>


                    <aside>
                    <section id="entrada">
                    <div>
                        <h2 class="h2-titulo">MODO DE ENTRADA:</h2>
                    </div>
                        <br>
                    <div>
                        <label>
                            <input type="radio" name="entrada" required> Agasalho
                        </label>
                        
                        <label>
                            <input type="radio" name="entrada" required> 1kg de alimento não perecível
                        </label>
                    </div>
                    </section>
                    </aside>
                    
                    <div id="paragrafo1">
                        <label>
                    <p><b>4.</b> Se houver, descreve a tua relação com o rap.</p>

                    <textarea maxlength="120" rows="4" placeholder="O rap pra mim é..." required></textarea>
                        </label>

                    <br><br>

                    <label>

                    <p><b>5.</b> Quem ou o que te aproximou do rap?</p>
                    <textarea maxlength="120" rows="4" placeholder="Eu conheci o rap..." required></textarea>

                    </label>
                    </div>

                    <br><br>

                    <div id="botao">
                        <button type="submit" value="confirmar">Confirmar</button>
                    </div>
                </form>
            </div> 
        </section>

        <br><br><br><br> <br><br><br><br> <br><br><br><br>

        <footer>
        <section id="contato">
        
            <aside>
            <a href="https://www.instagram.com/" target="_blank"><img class="img2" src="img/instagramlogo.png" width="40" height="auto" alt="Logo do Instagram"></a> 
            <a href="https://www.youtube.com/" target="_blank"><img class="img2" src="img/youtube-logo.webp" width="40" height="auto" alt="Logo do Youtube"></a>
            </aside>
        </section>
        </footer>
    </body>
</html>
